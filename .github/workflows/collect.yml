# Collects ship positions during the tracking period set on the admin page.
# Each run collects for about 5 hours, starts the next run near its end and only stops once
# that one is running, so collecting never stops (see collector/collect.js, "keep collecting").
# The schedule is a backup only: GitHub fires it every few hours at best.
# Outside the tracking period a run stops straight away.
name: Collect ship positions

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Test run with made-up ships sailing the course (no real AIS data)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # to start the next run and see which runs are going

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get positions saved by earlier runs
        run: |
          mkdir -p data-out
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch -q --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data-out
          fi

      - name: Collect and publish positions
        run: node collector/collect.js config.json data-out
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SIMULATE: ${{ inputs.simulate }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_CMD: bash collector/publish.sh data-out
